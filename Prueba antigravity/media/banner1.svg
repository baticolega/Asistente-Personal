<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" rx="24" fill="url(#bgGrad1)" />

  <!-- Ambient decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="#a855f7" opacity="0.35" filter="url(#glow)" />
  <circle cx="150" cy="380" r="220" fill="#3b82f6" opacity="0.3" filter="url(#glow)" />
  <circle cx="600" cy="50" r="120" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Abstract geometric grid lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="900" y1="0" x2="900" y2="450" />
  </g>

  <!-- Left Content Illustration (Minimalist Dashboard / Tasks) -->
  <g transform="translate(100, 75)">
    <!-- Main glass card -->
    <rect width="360" height="260" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    
    <!-- Header bar -->
    <circle cx="35" cy="35" r="8" fill="#ef4444" opacity="0.8" />
    <circle cx="58" cy="35" r="8" fill="#f59e0b" opacity="0.8" />
    <circle cx="81" cy="35" r="8" fill="#10b981" opacity="0.8" />

    <!-- Task preview bars -->
    <rect x="35" y="75" width="220" height="14" rx="7" fill="rgba(255,255,255,0.9)" />
    <rect x="35" y="105" width="170" height="10" rx="5" fill="rgba(255,255,255,0.5)" />

    <!-- Check items -->
    <rect x="35" y="145" width="24" height="24" rx="6" fill="#10b981" />
    <path d="M 40 157 L 46 163 L 54 151" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="75" y="152" width="180" height="10" rx="5" fill="rgba(255,255,255,0.7)" />

    <rect x="35" y="185" width="24" height="24" rx="6" fill="#6366f1" />
    <path d="M 40 197 L 46 203 L 54 191" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="75" y="192" width="140" height="10" rx="5" fill="rgba(255,255,255,0.7)" />

    <!-- Floating badge -->
    <rect x="230" y="215" width="150" height="42" rx="14" fill="#ffffff" filter="url(#glow)" />
    <text x="250" y="241" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#4f46e5">⚡ Organización</text>
  </g>

  <!-- Right Typography / Message -->
  <g transform="translate(560, 140)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff" letter-spacing="1">TU PANEL DIARIO</text>

    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff">
      ¡Tu Espacio Personal!
    </text>
    <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="rgba(255,255,255,0.85)">
      Controla tus metas, tareas de clase y hábitos con facilidad.
    </text>

    <!-- Sub tags -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="115" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="18" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">📅 Entregas</text>

      <rect x="130" y="0" width="105" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="145" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">🎯 Metas</text>

      <rect x="250" y="0" width="105" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="268" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">✨ Hábitos</text>
    </g>
  </g>
</svg>
