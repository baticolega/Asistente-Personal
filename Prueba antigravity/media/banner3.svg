<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" rx="24" fill="url(#bgGrad3)" />

  <!-- Ambient circles -->
  <circle cx="1100" cy="120" r="180" fill="#f59e0b" opacity="0.35" filter="url(#glow3)" />
  <circle cx="150" cy="350" r="220" fill="#f43f5e" opacity="0.3" filter="url(#glow3)" />

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="900" y1="0" x2="900" y2="450" />
  </g>

  <!-- Left Content Illustration: Controller, Clapperboard, Book -->
  <g transform="translate(100, 75)">
    <rect width="360" height="260" rx="20" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    
    <!-- Gaming controller icon graphic -->
    <g transform="translate(40, 30)">
      <rect width="80" height="52" rx="16" fill="rgba(255,255,255,0.85)" />
      <!-- Dpad -->
      <path d="M 22 26 H 34 M 28 20 V 32" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />
      <!-- ABXY buttons -->
      <circle cx="56" cy="22" r="3" fill="#ea580c" />
      <circle cx="64" cy="26" r="3" fill="#ea580c" />
      <circle cx="56" cy="30" r="3" fill="#ea580c" />
      <circle cx="48" cy="26" r="3" fill="#ea580c" />
    </g>

    <!-- Clapperboard / Film icon graphic -->
    <g transform="translate(140, 30)">
      <rect width="80" height="52" rx="12" fill="rgba(255,255,255,0.85)" />
      <rect x="0" y="0" width="80" height="16" rx="6" fill="#ea580c" />
      <polygon points="12,0 18,0 8,16 2,16" fill="#ffffff" />
      <polygon points="32,0 38,0 28,16 22,16" fill="#ffffff" />
      <polygon points="52,0 58,0 48,16 42,16" fill="#ffffff" />
      <polygon points="72,0 78,0 68,16 62,16" fill="#ffffff" />
      <polygon points="36,26 48,34 36,42" fill="#ea580c" />
    </g>

    <!-- Book icon graphic -->
    <g transform="translate(240, 30)">
      <rect width="80" height="52" rx="10" fill="rgba(255,255,255,0.85)" />
      <path d="M 20 18 C 30 14 40 16 40 40 C 40 16 50 14 60 18" fill="none" stroke="#ea580c" stroke-width="2.5" />
      <line x1="40" y1="18" x2="40" y2="40" stroke="#ea580c" stroke-width="2" />
    </g>

    <!-- Hobby item cards in preview -->
    <g transform="translate(35, 110)">
      <rect width="290" height="40" rx="10" fill="rgba(255,255,255,0.2)" />
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">🎬 Dune: Parte 2</text>
      <text x="210" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#fbbf24">⭐⭐⭐⭐⭐</text>

      <rect y="50" width="290" height="40" rx="10" fill="rgba(255,255,255,0.2)" />
      <text x="15" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">🎮 Elden Ring</text>
      <text x="210" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#a7f3d0">✓ Ya visto</text>

      <rect y="100" width="290" height="40" rx="10" fill="rgba(255,255,255,0.2)" />
      <text x="15" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">📚 Hábitos Atómicos</text>
      <text x="220" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.7)">Leyendo</text>
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(560, 140)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff" letter-spacing="1">OCIO Y ENTRETENIMIENTO</text>

    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff">
      Tu rincón de descanso
    </text>
    <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="rgba(255,255,255,0.85)">
      Apunta series, juegos y libros pendientes o valóralos al terminarlos.
    </text>

    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="125" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">🎬 Películas</text>

      <rect x="140" y="0" width="135" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="16" y="21" transform="translate(140, 0)" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">🎮 Videojuegos</text>

      <rect x="290" y="0" width="115" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="16" y="21" transform="translate(290, 0)" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">📚 Libros</text>
    </g>
  </g>
</svg>
