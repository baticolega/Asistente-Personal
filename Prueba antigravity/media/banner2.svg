<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" rx="24" fill="url(#bgGrad2)" />

  <!-- Ambient circles -->
  <circle cx="1100" cy="350" r="200" fill="#10b981" opacity="0.35" filter="url(#glow2)" />
  <circle cx="100" cy="100" r="180" fill="#38bdf8" opacity="0.3" filter="url(#glow2)" />

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="900" y1="0" x2="900" y2="450" />
  </g>

  <!-- Left Content Illustration: Gym, Scale, Diet -->
  <g transform="translate(100, 75)">
    <rect width="360" height="260" rx="20" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    
    <!-- Weight metric display -->
    <text x="35" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.8)">PESO HOY</text>
    <text x="35" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" fill="#ffffff">74.5 <tspan font-size="22" font-weight="500">kg</tspan></text>
    
    <!-- Progress curve / pulse -->
    <path d="M 35 180 Q 90 200 150 160 T 260 140 T 325 110" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" />
    <circle cx="325" cy="110" r="7" fill="#ffffff" filter="url(#glow2)" />

    <!-- Diet status pill -->
    <rect x="35" y="205" width="165" height="34" rx="17" fill="#10b981" />
    <path d="M 50 222 L 56 228 L 65 217" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="75" y="227" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff">DIETA COMPLETADA</text>

    <!-- Racha pill -->
    <rect x="215" y="205" width="110" height="34" rx="17" fill="rgba(255,255,255,0.2)" />
    <text x="235" y="227" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#ffffff">🔥 7 DÍAS</text>
  </g>

  <!-- Right Typography -->
  <g transform="translate(560, 140)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff" letter-spacing="1">GIMNASIO &amp; SALUD</text>

    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff">
      La disciplina es la clave
    </text>
    <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="rgba(255,255,255,0.85)">
      Registra tu pesaje diario y mantén tu racha de nutrición al día.
    </text>

    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="140" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="18" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">⚖️ Control de Peso</text>

      <rect x="155" y="0" width="135" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="172" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">🥗 Check de Dieta</text>

      <rect x="305" y="0" width="125" height="32" rx="8" fill="rgba(255,255,255,0.2)" />
      <text x="323" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#ffffff">📈 Evolución</text>
    </g>
  </g>
</svg>
